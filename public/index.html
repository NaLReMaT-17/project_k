<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конвертер Word ↔ PDF + QR</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#f3f4f6;
         margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; padding:20px; }
  .container { background:#fff; border-radius:16px; padding:40px; max-width:640px;
               width:100%; box-shadow:0 10px 25px rgba(0,0,0,.1); }
  h1 { margin:0 0 .5rem; font-size:1.8rem; text-align:center; }
  .subtitle { color:#6b7280; margin:0 0 2rem; text-align:center; }
  h2 { font-size:1.1rem; margin:0 0 1rem; color:#374151; }
  .section { margin-bottom:2rem; }
  .section:last-child { margin-bottom:0; }
  .divider { height:1px; background:#e5e7eb; margin:2rem 0; }
  .drop-area { border:3px dashed #e5e7eb; border-radius:12px; padding:40px 20px;
               cursor:pointer; transition:.2s; margin-bottom:1rem; text-align:center; }
  .drop-area.highlight { border-color:#3b82f6; background:#eff6ff; }
  .drop-area p { margin:0; color:#6b7280; }
  .browse { color:#3b82f6; font-weight:600; }
  input[type=file] { display:none; }
  .file-info { margin-top:.75rem; font-size:.9rem; color:#6b7280; min-height:1.2em;
               text-align:center; }
  .actions { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
  button { padding:12px 24px; border:none; border-radius:8px; font-size:1rem;
           font-weight:600; cursor:pointer; transition:.2s; flex:1; min-width:160px;
           background:#3b82f6; color:#fff; }
  button:hover:not(:disabled) { background:#2563eb; }
  button.secondary { background:transparent; color:#3b82f6; border:2px solid #3b82f6; }
  button.secondary:hover:not(:disabled) { background:#3b82f6; color:#fff; }
  button:disabled { background:#9ca3af; opacity:.5; cursor:not-allowed; }
  button.secondary:disabled { background:transparent; color:#9ca3af; border-color:#9ca3af; }

  /* QR-секция */
  .qr-row { display:flex; gap:.5rem; }
  .qr-row input[type=url] {
    flex:1; padding:12px 14px; border:2px solid #e5e7eb; border-radius:8px;
    font-size:1rem; font-family:inherit; transition:.2s; min-width:0;
  }
  .qr-row input[type=url]:focus { outline:none; border-color:#3b82f6; }
  .qr-row button { flex:0 0 auto; min-width:auto; }
  .qr-hint { font-size:.8rem; color:#6b7280; margin:.4rem 0 0; }
  .qr-result { margin-top:1.25rem; display:none; text-align:center; }
  .qr-result.visible { display:block; }
  .qr-result img { display:inline-block; border:1px solid #e5e7eb; border-radius:8px;
                   background:#fff; max-width:100%; height:auto; }
  .qr-url { font-size:.8rem; color:#6b7280; margin-top:.5rem; word-break:break-all; }
  .qr-actions { display:flex; gap:.5rem; justify-content:center; margin-top:1rem; flex-wrap:wrap; }
  .qr-actions button, .qr-actions a {
    padding:10px 18px; font-size:.9rem; min-width:auto; flex:0 0 auto;
  }
  .qr-actions a {
    display:inline-flex; align-items:center; justify-content:center;
    background:#10b981; color:#fff; text-decoration:none; border-radius:8px;
    font-weight:600; transition:.2s;
  }
  .qr-actions a:hover { background:#059669; }

  .status { margin-top:1rem; padding:12px; border-radius:8px; display:none; font-weight:500; }
  .status.processing { display:block; background:#dbeafe; color:#1e40af; }
  .status.success { display:block; background:#d1fae5; color:#065f46; }
  .status.error { display:block; background:#fee2e2; color:#991b1b; }
  .spinner { display:inline-block; width:16px; height:16px; border:3px solid rgba(0,0,0,.15);
             border-top-color:currentColor; border-radius:50%; animation:spin 1s linear infinite;
             margin-right:8px; vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .footer { margin-top:2rem; font-size:.8rem; color:#6b7280; text-align:center; }
</style>
</head>
<body>
<div class="container">
  <h1>Конвертер Word ↔ PDF + QR</h1>
  <p class="subtitle">Серверная конвертация и генерация QR-кодов</p>

  <!-- ─── Секция 1: конвертер файлов ─────────────────────────────────────── -->
  <section class="section">
    <h2>1. Конвертация документов</h2>

    <div class="drop-area" id="dropArea">
      <p>Перетащите файл сюда или <span class="browse">выберите</span></p>
      <p class="file-info" id="fileInfo"></p>
      <input type="file" id="fileInput" accept=".docx,.pdf">
    </div>

    <div class="actions">
      <button id="toPdfBtn" disabled>Word → PDF</button>
      <button id="toWordBtn" class="secondary" disabled>PDF → Word</button>
    </div>

    <div class="status" id="status"></div>
  </section>

  <div class="divider"></div>

  <!-- ─── Секция 2: ссылка → QR-код ──────────────────────────────────────── -->
  <section class="section">
    <h2>2. Ссылка → QR-код</h2>

    <form id="qrForm" autocomplete="off">
      <div class="qr-row">
        <input type="url" id="qrUrl" placeholder="https://example.com/page"
               required spellcheck="false">
        <button type="submit" id="qrBtn">Сгенерировать</button>
      </div>
      <p class="qr-hint">Введите полный URL, начиная с http:// или https://</p>
    </form>

    <div class="qr-result" id="qrResult">
      <img id="qrImage" alt="QR-код">
      <div class="qr-url" id="qrUrlShown"></div>
      <div class="qr-actions">
        <a id="qrDownload" download="qrcode.png">Скачать PNG</a>
        <button type="button" id="qrResetBtn" class="secondary">Сбросить</button>
      </div>
    </div>

    <div class="status" id="qrStatus"></div>
  </section>

  <p class="footer">Файлы и ссылки не сохраняются на сервере.</p>
</div>

<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════════
  // Секция 1: DOCX ↔ PDF
  // ═══════════════════════════════════════════════════════════════════════════
  const dropArea  = document.getElementById('dropArea');
  const fileInput = document.getElementById('fileInput');
  const fileInfo  = document.getElementById('fileInfo');
  const toPdfBtn  = document.getElementById('toPdfBtn');
  const toWordBtn = document.getElementById('toWordBtn');
  const statusEl  = document.getElementById('status');

  let currentFile = null;

  ['dragover', 'drop'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault())
  );
  ['dragenter', 'dragover'].forEach(ev =>
    dropArea.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      dropArea.classList.add('highlight');
    })
  );
  ['dragleave', 'drop'].forEach(ev =>
    dropArea.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      if (ev === 'dragleave' && dropArea.contains(e.relatedTarget)) return;
      dropArea.classList.remove('highlight');
    })
  );

  dropArea.addEventListener('drop', e => {
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) processFile(files[0]);
  });
  dropArea.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    if (e.target.files.length) processFile(e.target.files[0]);
    fileInput.value = '';
  });

  function processFile(file) {
    const name = file.name.toLowerCase();
    const isDocx = name.endsWith('.docx');
    const isPdf  = name.endsWith('.pdf');

    if (!isDocx && !isPdf) {
      showStatus('Поддерживаются только .docx и .pdf', 'error');
      resetFile();
      return;
    }

    currentFile = file;
    fileInfo.textContent = `${file.name} — ${(file.size / 1024).toFixed(1)} KB`;
    hideStatus();

    toPdfBtn.disabled  = !isDocx;
    toWordBtn.disabled = !isPdf;
    toPdfBtn.classList.toggle('secondary',  !isDocx);
    toWordBtn.classList.toggle('secondary', !isPdf);
  }

  function resetFile() {
    currentFile = null;
    fileInfo.textContent = '';
    toPdfBtn.disabled  = true;
    toWordBtn.disabled = true;
  }

  function showStatus(msg, type, spin) {
    statusEl.className = 'status ' + type;
    statusEl.innerHTML = (spin ? '<span class="spinner"></span>' : '') +
                         msg.replace(/\n/g, '<br>');
  }
  function hideStatus() { statusEl.className = 'status'; statusEl.textContent = ''; }

  async function upload(endpoint, button) {
    if (!currentFile) return;
    const fd = new FormData();
    fd.append('file', currentFile);

    const otherButton = button === toPdfBtn ? toWordBtn : toPdfBtn;
    button.disabled = otherButton.disabled = true;

    showStatus('Отправляю на сервер и конвертирую… (10–60 сек)', 'processing', true);

    try {
      const resp = await fetch(endpoint, { method: 'POST', body: fd });
      if (!resp.ok) {
        let errMsg = `HTTP ${resp.status}`;
        try {
          const j = await resp.json();
          errMsg = j.error || errMsg;
          if (j.details) errMsg += '\n\n' + j.details;
        } catch {}
        throw new Error(errMsg);
      }

      const blob = await resp.blob();
      const filename = currentFile.name.replace(/\.(docx|pdf)$/i, m =>
        m.toLowerCase() === '.docx' ? '.pdf' : '.docx');

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      showStatus('✅ Готово! Файл скачивается.', 'success');
    } catch (err) {
      console.error(err);
      showStatus('❌ ' + err.message, 'error');
    } finally {
      const name = currentFile ? currentFile.name.toLowerCase() : '';
      toPdfBtn.disabled  = !name.endsWith('.docx');
      toWordBtn.disabled = !name.endsWith('.pdf');
    }
  }

  toPdfBtn.addEventListener('click',  () => upload('/api/docx-to-pdf', toPdfBtn));
  toWordBtn.addEventListener('click', () => upload('/api/pdf-to-docx', toWordBtn));

  // ═══════════════════════════════════════════════════════════════════════════
  // Секция 2: Ссылка → QR-код
  // ═══════════════════════════════════════════════════════════════════════════
  const qrForm      = document.getElementById('qrForm');
  const qrUrlInput  = document.getElementById('qrUrl');
  const qrBtn       = document.getElementById('qrBtn');
  const qrResult    = document.getElementById('qrResult');
  const qrImage     = document.getElementById('qrImage');
  const qrUrlShown  = document.getElementById('qrUrlShown');
  const qrDownload  = document.getElementById('qrDownload');
  const qrResetBtn  = document.getElementById('qrResetBtn');
  const qrStatus    = document.getElementById('qrStatus');

  let currentQrObjectUrl = null;
  let currentQrBlob = null;
  let currentQrUrl = '';

  function qrShowStatus(msg, type, spin) {
    qrStatus.className = 'status ' + type;
    qrStatus.innerHTML = (spin ? '<span class="spinner"></span>' : '') +
                         msg.replace(/\n/g, '<br>');
  }
  function qrHideStatus() { qrStatus.className = 'status'; qrStatus.textContent = ''; }

  function qrClear() {
    if (currentQrObjectUrl) {
      URL.revokeObjectURL(currentQrObjectUrl);
      currentQrObjectUrl = null;
    }
    currentQrBlob = null;
    currentQrUrl = '';
    qrImage.removeAttribute('src');
    qrUrlShown.textContent = '';
    qrDownload.removeAttribute('href');
    qrResult.classList.remove('visible');
    qrHideStatus();
  }

  qrResetBtn.addEventListener('click', () => {
    qrUrlInput.value = '';
    qrClear();
    qrUrlInput.focus();
  });

  qrForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    qrHideStatus();

    const raw = qrUrlInput.value.trim();
    if (!raw) {
      qrShowStatus('Введите ссылку', 'error');
      return;
    }

    // Лёгкая клиентская валидация (сервер всё равно проверит)
    let parsed;
    try { parsed = new URL(raw); }
    catch { qrShowStatus('Некорректный URL. Пример: https://example.com', 'error'); return; }
    if (!['http:', 'https:'].includes(parsed.protocol)) {
      qrShowStatus('Поддерживаются только http:// и https://', 'error');
      return;
    }

    // Сбрасываем предыдущий QR
    if (currentQrObjectUrl) {
      URL.revokeObjectURL(currentQrObjectUrl);
      currentQrObjectUrl = null;
    }
    currentQrBlob = null;
    qrResult.classList.remove('visible');
    qrDownload.removeAttribute('href');

    qrBtn.disabled = true;
    qrShowStatus('Генерирую QR-код…', 'processing', true);

    try {
      const resp = await fetch('/api/link-to-qr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: raw, size: 512 }),
      });

      if (!resp.ok) {
        let errMsg = `HTTP ${resp.status}`;
        try {
          const j = await resp.json();
          errMsg = j.error || errMsg;
          if (j.details) errMsg += '\n\n' + j.details;
        } catch {}
        throw new Error(errMsg);
      }

      const blob = await resp.blob();
      currentQrBlob = blob;
      currentQrUrl = raw;

      currentQrObjectUrl = URL.createObjectURL(blob);
      qrImage.src = currentQrObjectUrl;
      qrUrlShown.textContent = raw;

      // Имя файла: qrcode-<host>.png
      const host = parsed.host.replace(/[^\w.-]/g, '_').slice(0, 40) || 'link';
      qrDownload.href = currentQrObjectUrl;
      qrDownload.download = `qrcode-${host}.png`;

      qrResult.classList.add('visible');
      qrShowStatus('✅ QR-код готов.', 'success');
    } catch (err) {
      console.error(err);
      qrShowStatus('❌ ' + err.message, 'error');
    } finally {
      qrBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
